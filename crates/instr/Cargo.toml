[package]
name = "cap-instr"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps object keys in JSON text order and `float_roundtrip`
# makes float parsing correctly rounded. Both are required by the result-MAC
# canonicaliser (`mac.rs`) to reproduce `JSON.stringify` byte for byte. Without
# `float_roundtrip`, serde_json's fast float path is off by 1 ulp on some
# values, which would change the digits we re-serialise and break MAC checks.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
hmac = "0.12"
subtle = "2"
# Shortest round-trip float digits. Rust's own `Display`/`{:e}` breaks ties
# differently from ECMAScript for a handful of f64 values, so the number
# canonicaliser builds on ryu (which is correctly rounded, like V8).
ryu = "1"
