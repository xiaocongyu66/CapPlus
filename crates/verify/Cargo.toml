[package]
name = "cap-verify"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cap-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
form_urlencoded = "1"
subtle = "2"
argon2 = "0.5"
